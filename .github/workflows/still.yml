name: Still agent gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripted agent against the deterministic mock
        uses: ./
        with:
          personas: '1000'
          trials: '5'
          max-refund: '100.00'
          max-order-refund: '100.00'
          refund-currency: USD
