name: Still agent gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripted agent against the deterministic mock
        uses: ./
        with:
          personas: '1000'
          trials: '5'
          max-refund: '100.00'
          max-order-refund: '100.00'
          refund-currency: USD
  http-agent-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start the scripted HTTP agent
        shell: bash
        run: |
          AGENT_PORT=8787 STILL_AGENT_MODE=safe node examples/trial-agent.mjs > "$RUNNER_TEMP/still-http-agent.log" 2>&1 &
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/8787) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/still-http-agent.log"
          exit 1
      - name: Rerun exported HTTP agent regression
        uses: ./
        with:
          agent-url: http://127.0.0.1:8787/agent
          regression-file: examples/http-agent-regression.json
  toolkit-agent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start the scripted toolkit-definition agent
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/still-toolkit" @paypal/agent-toolkit@1.11.0
          STILL_TOOLKIT_INSTALL="$RUNNER_TEMP/still-toolkit" AGENT_PORT=8788 node examples/toolkit-trial-agent.mjs > "$RUNNER_TEMP/still-toolkit-agent.log" 2>&1 &
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/8788) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/still-toolkit-agent.log"
          exit 1
      - name: Gate toolkit-style agent against the deterministic mock
        uses: ./
        with:
          agent: external
          agent-url: http://127.0.0.1:8788/agent
          agent-protocol: '3'
          personas: '10'
          trials: '5'
      - name: Rerun exported toolkit agent regression
        uses: ./
        with:
          agent-url: http://127.0.0.1:8788/agent
          regression-file: examples/toolkit-agent-regression.json
  mcp-agent-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install example host dependencies
        run: npm install --prefix "$RUNNER_TEMP/still-mcp" @paypal/agent-toolkit@1.11.0 @modelcontextprotocol/sdk@1.32.2
      - name: Gate scripted MCP host against the deterministic mock
        uses: ./
        env:
          STILL_TOOLKIT_INSTALL: ${{ runner.temp }}/still-mcp
        with:
          agent: mcp
          agent-module: examples/mcp-scripted-host.mjs
          personas: '10'
          trials: '5'
      - name: Rerun exported MCP regression
        uses: ./
        env:
          STILL_TOOLKIT_INSTALL: ${{ runner.temp }}/still-mcp
        with:
          agent-module: examples/mcp-scripted-host.mjs
          regression-file: examples/mcp-agent-regression.json
