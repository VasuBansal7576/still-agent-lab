name: Still agent gate
description: Run a retail agent through Still's deterministic PayPal mock and fail on unsafe or unverified results.
inputs:
  personas:
    description: Number of synthetic personas.
    default: '1000'
  trials:
    description: Trials per persona.
    default: '5'
  concurrency:
    description: Maximum concurrent trials.
    default: '20'
  agent:
    description: safe, buggy, external, or mcp.
    default: safe
  agent-url:
    description: Loopback HTTP endpoint when agent is external.
    default: ''
  agent-module:
    description: Trusted local MCP host module path when agent is mcp. Install its dependencies before running the action.
    default: ''
  agent-protocol:
    description: External agent protocol, 2 or 3. Version 3 uses selected toolkit-shaped calls.
    default: '2'
  regression-file:
    description: Optional exported HTTP or MCP mock regression. Requires exactly one of agent-url or agent-module.
    default: ''
  seed:
    description: Persona generation seed.
    default: still
  mock-profile:
    description: completed or sandbox-test-card.
    default: completed
  max-refund:
    description: Optional maximum per refund call, with two decimals; requires refund-currency.
    default: ''
  max-order-refund:
    description: Optional maximum total refunds per order, with two decimals; requires refund-currency.
    default: ''
  refund-currency:
    description: Three-letter uppercase currency for either or both refund limits.
    default: ''
  min-pass-all:
    description: Minimum fraction of personas passing every trial.
    default: '1'
outputs:
  pass-at-1:
    description: Fraction of trials that passed.
    value: ${{ steps.run.outputs.pass-at-1 }}
  pass-all-trials:
    description: Fraction of personas passing every trial.
    value: ${{ steps.run.outputs.pass-all-trials }}
  gate:
    description: pass or fail.
    value: ${{ steps.run.outputs.gate }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - id: run
      shell: bash
      env:
        STILL_PERSONAS: ${{ inputs.personas }}
        STILL_TRIALS: ${{ inputs.trials }}
        STILL_CONCURRENCY: ${{ inputs.concurrency }}
        STILL_AGENT: ${{ inputs.agent }}
        STILL_AGENT_URL: ${{ inputs.agent-url }}
        STILL_AGENT_MODULE: ${{ inputs.agent-module }}
        STILL_AGENT_PROTOCOL: ${{ inputs.agent-protocol }}
        STILL_REGRESSION_FILE: ${{ inputs.regression-file }}
        STILL_SEED: ${{ inputs.seed }}
        STILL_MOCK_PROFILE: ${{ inputs.mock-profile }}
        STILL_MAX_REFUND: ${{ inputs.max-refund }}
        STILL_MAX_ORDER_REFUND: ${{ inputs.max-order-refund }}
        STILL_REFUND_CURRENCY: ${{ inputs.refund-currency }}
        STILL_MIN_PASS_ALL: ${{ inputs.min-pass-all }}
      run: |
        if [[ -n "$STILL_REGRESSION_FILE" ]]; then
          if [[ -n "$STILL_AGENT_URL" && -n "$STILL_AGENT_MODULE" ]] || [[ -z "$STILL_AGENT_URL" && -z "$STILL_AGENT_MODULE" ]]; then echo 'regression-file requires exactly one of agent-url or agent-module' >&2; exit 2; fi
          regression_args=(regression --file "$STILL_REGRESSION_FILE")
          if [[ -n "$STILL_AGENT_MODULE" ]]; then regression_args+=(--agent-module "$STILL_AGENT_MODULE"); else regression_args+=(--agent-url "$STILL_AGENT_URL"); fi
          set +e
          node "$GITHUB_ACTION_PATH/bin/still.mjs" "${regression_args[@]}"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then echo 'gate=pass' >> "$GITHUB_OUTPUT"; else echo 'gate=fail' >> "$GITHUB_OUTPUT"; fi
          exit "$status"
        fi
        args=(test --personas "$STILL_PERSONAS" --trials "$STILL_TRIALS" --concurrency "$STILL_CONCURRENCY" --agent "$STILL_AGENT" --agent-protocol "$STILL_AGENT_PROTOCOL" --seed "$STILL_SEED" --mock-profile "$STILL_MOCK_PROFILE" --min-pass-all "$STILL_MIN_PASS_ALL" --json)
        if [[ -n "$STILL_AGENT_URL" ]]; then args+=(--agent-url "$STILL_AGENT_URL"); fi
        if [[ -n "$STILL_AGENT_MODULE" ]]; then args+=(--agent-module "$STILL_AGENT_MODULE"); fi
        if [[ -n "$STILL_MAX_REFUND" ]]; then args+=(--max-refund "$STILL_MAX_REFUND"); fi
        if [[ -n "$STILL_MAX_ORDER_REFUND" ]]; then args+=(--max-order-refund "$STILL_MAX_ORDER_REFUND"); fi
        if [[ -n "$STILL_REFUND_CURRENCY" ]]; then args+=(--refund-currency "$STILL_REFUND_CURRENCY"); fi
        summary="$RUNNER_TEMP/still-action-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
        set +e
        node "$GITHUB_ACTION_PATH/bin/still.mjs" "${args[@]}" > "$summary"
        status=$?
        set -e
        cat "$summary"
        if [[ -s "$summary" ]]; then
          node -e 'const x=require(process.argv[1]); const fs=require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `pass-at-1=${x.passAt1}\npass-all-trials=${x.passAllTrials}\ngate=${x.gate}\n`)' "$summary"
        fi
        exit "$status"
