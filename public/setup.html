<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandbox setup · Still</title><style>body{background:#edeae0;color:#181916;font:16px system-ui,sans-serif;max-width:540px;margin:10vh auto;padding:24px}h1{font-size:34px;letter-spacing:-1px}p{line-height:1.5;color:#555}label{display:block;font-weight:600;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #888;background:#faf9f2;font:inherit}button{background:#181916;color:white;border:0;padding:14px 20px;margin-top:22px;font:inherit;cursor:pointer}#status{margin-top:20px}a{color:#333}</style></head><body><h1>Connect PayPal sandbox.</h1><p>Enter the client ID and secret from your PayPal sandbox app. Still verifies the sandbox credentials and saves them in your Mac Keychain so the connection survives a restart.</p><form id="setup"><label for="client">Sandbox client ID</label><input id="client" type="password" autocomplete="off" required><label for="secret">Sandbox client secret</label><input id="secret" type="password" autocomplete="off" required><button>Connect sandbox</button></form><p id="status" role="status"></p><p><a href="/">Return to the test lab</a></p><script>document.querySelector('#setup').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#status');status.textContent='Connecting…';try{const r=await fetch('/api/setup/paypal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientId:document.querySelector('#client').value,clientSecret:document.querySelector('#secret').value})});const data=await r.json();if(!r.ok)throw Error(data.error);e.target.reset();status.textContent='Sandbox credentials were verified and saved securely in your Mac Keychain.'}catch(error){status.textContent=error.message||'Connection failed.'}});</script></body></html>
